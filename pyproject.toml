[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ficosim"
version = "0.1.0"
description = "Interactive credit score simulator for educational purposes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zanden Kane" },
]
dependencies = [
    "rich>=13",
    "questionary>=2.0",
]

[project.scripts]
ficosim = "ficosim.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100


[tool.setuptools.packages.find]
include = ["ficosim*"]
exclude = ["assets*", "tests*"]
